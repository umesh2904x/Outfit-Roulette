name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run backend tests
        run: npm test

      - name: Validate monitoring stack configuration
        env:
          GROQ_API_KEY: ci-smoke-test
          GRAFANA_PASSWORD: ci-grafana-test
        run: docker compose config > /dev/null

      - name: Build Docker image
        run: docker build --tag outfit-roulette:ci .

      - name: Run container smoke test
        run: |
          docker run --detach --name outfit-roulette-ci \
            --env GROQ_API_KEY=ci-smoke-test \
            --publish 4173:4173 \
            outfit-roulette:ci
          cleanup() {
            docker logs outfit-roulette-ci || true
            docker rm --force outfit-roulette-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/api/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done

          grep -q '"ok":true' /tmp/health.json
          grep -q '"aiConfigured":true' /tmp/health.json
          curl --fail --silent --output /tmp/home.html http://127.0.0.1:4173/
          grep -q 'Outfit Roulette' /tmp/home.html

  publish:
    name: Publish Docker image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check for Docker Hub token
        id: dockerhub
        shell: bash
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -n "$DOCKERHUB_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: umesh290406
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish image
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            umesh290406/outfit-roulette:latest
            umesh290406/outfit-roulette:${{ github.sha }}

      - name: Explain skipped publishing
        if: steps.dockerhub.outputs.enabled != 'true'
        run: echo 'Docker publishing skipped. Add the DOCKERHUB_TOKEN GitHub Actions secret to enable it.' >> "$GITHUB_STEP_SUMMARY"

  deploy-render:
    name: Deploy to Render
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check for Render deploy hook
        id: render
        shell: bash
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [[ -n "$RENDER_DEPLOY_HOOK" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Render deployment
        if: steps.render.outputs.enabled == 'true'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK" --output /dev/null
          echo 'Render deployment triggered.' >> "$GITHUB_STEP_SUMMARY"

      - name: Explain skipped deployment
        if: steps.render.outputs.enabled != 'true'
        run: echo 'Render deployment skipped. Create the service from render.yaml, configure GROQ_API_KEY in Render, then add its deploy hook as the RENDER_DEPLOY_HOOK Actions secret.' >> "$GITHUB_STEP_SUMMARY"
